# Phase 1 — Infrastructure: Redis + MinIO + Vault + Prometheus + Grafana
# Usage: docker-compose up [redis|minio|vault|prometheus|grafana|idealidad-exporter]
# All ports are localhost-bound; TLS disabled until Phase 5.

services:
  # ── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: llm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel notice
    volumes:
      - redis-data:/data
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - llm-network
    ports:
      - "127.0.0.1:6380:6379"

  # ── MinIO ────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: llm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - llm-network
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # ── MinIO init — creates buckets ─────────────────────────
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: llm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/llm-client-files &&
        mc mb --ignore-existing local/llm-client-forensic &&
        echo 'Buckets ready.' &&
        mc ls local/
      "
    networks:
      - llm-network
    restart: "no"

  # ── HashiCorp Vault (dev-mode) ───────────────────────────
  vault:
    image: hashicorp/vault:latest
    container_name: llm-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=root
    env_file:
      - .env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - llm-network
    ports:
      - "127.0.0.1:8200:8200"

  # ── Vault init — transit engine + key + policy ───────────
  vault-init:
    image: hashicorp/vault:latest
    container_name: llm-vault-init
    depends_on:
      vault:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    volumes:
      - ./ops/vault/policies:/policies:ro
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        if ! vault secrets list | grep -q '^transit/'; then
          vault secrets enable transit
        fi
        if ! vault read -field=type transit/keys/forensic-aes256-gcm >/dev/null 2>&1; then
          vault write -f transit/keys/forensic-aes256-gcm type=aes256-gcm96
        fi
        vault policy write forensic-encryptor /policies/forensic-encryptor.hcl
        echo 'Vault transit configured.'
        vault policy read forensic-encryptor
    networks:
      - llm-network
    restart: "no"

  # ── Prometheus (ideality metric, G-2) ────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: llm-prometheus
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=220d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-network
    ports:
      - "127.0.0.1:9090:9090"

  # ── Grafana (dashboards + alerting, G-2) ─────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: llm-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/placeholder}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-network
    ports:
      - "127.0.0.1:3000:3000"

  # ── Ideality exporter (ROADMAP §18.2, G-2) ───────────────
  idealidad-exporter:
    image: python:3.12-slim
    container_name: llm-idealidad-exporter
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - ./src:/repo/src:ro
      - ./scripts:/repo/scripts:ro
      - ./migrations:/repo/migrations:ro
      - ./ops:/repo/ops:ro
      - ./analytics:/repo/analytics:ro
      - ./pyproject.toml:/repo/pyproject.toml:ro
    command: >
      sh -c "pip install --quiet prometheus-client==0.22.1 &&
             exec python scripts/collect_idealidad_metrics.py --port 9101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - llm-network
    ports:
      - "127.0.0.1:9101:9101"

volumes:
  redis-data:
  minio-data:
  prometheus-data:

networks:
  llm-network:
    driver: bridge
