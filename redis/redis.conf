# === Phase 3 — ADR-011 Semantic Cache (DB 2) ===
# Global policy change: allkeys-lru + maxmemory=1GB to support Tier-3 semantic cache
# DB 0: pub/sub cancel (ADR-013, no eviction needed)
# DB 1: checkpoint-WAL (ADR-010, keys evictable but safe due to composite checkpointer → read-through to Postgres)
# DB 2: semantic cache (ADR-011, TTL=24h, LRU eviction under pressure)
# Rationale: composite checkpointer (ADR-010) makes Redis eviction of checkpoint keys safe (Postgres is source of truth)
# AOF retained for DB 1 durability (appendonly yes, appendfsync everysec, save "")
appendonly yes
appendfsync everysec
maxmemory 1gb
maxmemory-policy allkeys-lru
notify-keyspace-events ""
dir /data
save ""
databases 16
