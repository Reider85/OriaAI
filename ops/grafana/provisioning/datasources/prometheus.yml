# Grafana datasource provisioning — wires the Prometheus instance that scrapes
# the ideality exporter. The fixed uid lets the dashboard and alert rules refer
# to it as `prometheus`.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1h
      httpMethod: POST
