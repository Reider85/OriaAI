# Grafana dashboard provisioning — auto-loads every dashboard JSON from the
# mounted /var/lib/grafana/dashboards directory on startup.
#
# Folders come from the directory structure (Phase 3 F-2):
#   Architecture/  → folder "Architecture" (Phase 1/2 dashboards)
#   Phase 3/       → folder "Phase 3" (llm-cost-router.json)
# A single provider with foldersFromFilesStructure avoids uid conflicts that
# would occur if two providers scanned the same path into different folders.
apiVersion: 1

providers:
  - name: Dashboards
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
