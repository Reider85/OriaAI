# Grafana unified alerting rules for the architecture ideality metric (G-2)
# and Phase 2 control point (ALPHA-PROMPTS F-2).
#
# Phase 1 (G-2):
#   - idealidad_ratio < 1.0 sustained over a 14-day window (trend down).
#   - dependency_count grew by more than 2 within 7 days (over-engineering).
# Phase 2 control point (F-2), 7-day trend windows:
#   - Phase 2 ADR ideality ratio < 1.0.
#   - reranker fallback_count > 100/day.
#   - checkpoint recovery loss proxy > 5s (recovery p99 duration).
#   - hybrid exact_term recall@5 regression > 5% (delta of improvement < -5).
#
# All rules carry the `team: architecture` label, which the notification policy
# routes to the Slack contact point.
apiVersion: 1

groups:
  - orgId: 1
    name: architecture-idealidad
    folder: Architecture
    interval: 1m
    rules:
      - uid: architecture-idealidad-trend-down
        title: Architecture idealidad trend down
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Architecture idealidad trend down: ratio {{ $values.A.Value }} < 1.0
            over the last 14 days. Review recent ADR approvals.
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 1209600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min(llm_client_idealidad_ratio)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

  - orgId: 1
    name: phase2-control-point
    folder: Architecture
    interval: 1m
    rules:
      - uid: phase2-idealidad-ratio-low
        title: Phase 2 idealidad ratio below control point
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Phase 2 ADR ideality ratio {{ $values.A.Value }} < 1.0 over the last
            7 days. Phase 2 control point not reached (expected 1.5 = 3 caps / 2 deps).
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min(llm_client_idealidad_ratio{phase="Phase 2"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: reranker-fallback-high
        title: Reranker fallback count high
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Reranker fallback events {{ $values.A.Value }} > 100/day over the last
            7 days. Reranker chain is degrading (ADR-017).
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: increase(llm_client_reranker_fallback_count[1d])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 100
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: checkpoint-recovery-loss-high
        title: Checkpoint recovery loss high
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Checkpoint recovery p99 duration {{ $values.A.Value }} ms > 5000 ms
            over the last 7 days. Acceptable-risk breach (data-loss window > 5s).
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.99, sum(rate(llm_client_checkpoint_recovery_duration_ms_bucket[5m])) by (le))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: hybrid-exact-term-regression
        title: Hybrid exact_term recall regression
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Hybrid exact_term recall@5 improvement regressed by {{ $values.A.Value }}%
            over the last 7 days (threshold: drop > 5%). ADR-020 quality regression.
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: delta(hybrid_recall_improvement_percentage[7d])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - -5
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: min
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

  - orgId: 1
    name: hybrid-rag-recall
    folder: Architecture
    interval: 1m
    rules:
      - uid: hybrid-rag-recall-improvement-low
        title: Hybrid RAG recall improvement low
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Hybrid RAG exact_term recall improvement {{ $values.A.Value }}% < 30%
            over the last 7 days. This fails the E-4 A/B test criteria.
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min(hybrid_recall_improvement_percentage)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 30
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: min
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: hybrid-rag-latency-overhead-high
        title: Hybrid RAG latency overhead high
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Hybrid RAG latency overhead {{ $values.A.Value }}% > 50%
            over the last 7 days. This fails the E-4 latency criteria.
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: max(hybrid_recall_latency_overhead_percentage)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 50
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: hybrid-rag-subtype-threshold-fail
        title: Hybrid RAG subtype threshold failure
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Hybrid RAG subtype threshold failed: {{ $values.A.Value }} ({{ $values.B.Value }})
            improvement below threshold. SKU: >=40%, error_code: >=40%, employee_id: >=25%.
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: hybrid_recall_subtype_compliance
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - true
                    type: eq
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: all
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: architecture-dependency-spike
        title: Architecture dependency spike
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Dependency count grew by {{ $values.A.Value }} in the last 7 days
            (> 2). Review for potential over-engineering.
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: max(delta(llm_client_dependency_count[7d]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: checkpoint-p99-latency-high
        title: Checkpoint p99 latency high
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Checkpoint p99 latency {{ $values.A.Value }} ms > 2ms over the last 7 days
            (trend up). This breaches the ADR-010 latency budget.
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.99, sum(rate(llm_client_checkpoint_write_redis_latency_ms_bucket[5m])) by (le))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: checkpoint-p50-latency-warning
        title: Checkpoint p50 latency warning
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Checkpoint p50 latency {{ $values.A.Value }} ms > 1ms (early warning signal
            of p99 breach). Monitor for degradation trend.
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.50, sum(rate(llm_client_checkpoint_write_redis_latency_ms_bucket[5m])) by (le))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

  - orgId: 1
    name: checkpoint-recovery
    folder: Architecture
    interval: 1m
    rules:
      - uid: checkpoint-recovery-time-high
        title: Checkpoint recovery p99 duration high
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Checkpoint recovery p99 duration {{ $values.A.Value }} ms > 10000 ms
            (B-5 budget: recovery must complete under 10s for 100 active threads).
        labels:
          team: architecture
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.99, sum(rate(llm_client_checkpoint_recovery_duration_ms_bucket[5m])) by (le))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: checkpoint-recovery-corrupted
        title: Checkpoint recovery corrupted states
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            {{ $values.A.Value }} thread state(s) failed post-recovery validation
            in the last 24h. Human review required (B-5).
        labels:
          team: architecture
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: increase(llm_client_checkpoint_recovery_corrupted_count_total[24h])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: checkpoint-recovery-timeout
        title: Checkpoint recovery timeout
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Checkpoint recovery hit the startup timeout ({{ $values.A.Value }} run(s)
            finished partially in the last 24h).
        labels:
          team: architecture
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: increase(llm_client_checkpoint_recovery_timeout_count_total[24h])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: max
                  type: query
              data:
                source: A
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
