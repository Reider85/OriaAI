name: Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  PIP_CACHE_VERSION: v1
  REDIS_URL: redis://127.0.0.1:6380/0
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  VAULT_ADDR: http://127.0.0.1:8200

jobs:
  # F-2 (PII leak audit) runs here at unit level, plus lint + typecheck.
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Download spaCy model for PII audit (F-2)
        run: python -m spacy download en_core_web_md
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (ruff) — scoped to Phase 1 files
        run: >-
          ruff format --check
          src/llm_client/transport
          tests/unit/test_pii_leak_audit.py
          tests/integration/test_filestorage_parity.py
          tests/staging_load
      - name: Typecheck (mypy)
        run: mypy src/llm_client
      - name: Unit tests + PII leak audit (F-2) + coverage
        run: >-
          pytest tests/unit --maxfail=1
          --cov=src/llm_client
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
      - name: G-2 Ideality metrics collect (verify no crash)
        run: python scripts/collect_idealidad_metrics.py --once > /dev/null

  # Block A infra (Redis/MinIO/Vault) + F-3 parity on dev MinIO.
  integration-dev:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        command: server /data
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ['8200:8200']
        command: server -dev
        options: >-
          --health-cmd "wget -qO- http://localhost:8200/v1/sys/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Initialize Vault transit engine
        run: |
          docker run --rm --network host \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=root \
            hashicorp/vault:latest \
            sh -c 'vault secrets enable transit && vault write -f transit/keys/forensic-aes256-gcm type=aes256-gcm96'
      - name: Integration tests (F-3 parity on dev MinIO + B-1 infra)
        run: pytest tests/integration --maxfail=1

  # F-4 integration-staging: forensic stream enabled + Vault (staging environment)
  integration-staging:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging
      FORENSIC_STREAM_ENABLED: 'true'
      KMS_PROVIDER: vault
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
      VAULT_TRANSIT_KEY: forensic-aes256-gcm
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORENSIC_BUCKET: llm-client-forensic
      REDIS_URL: redis://127.0.0.1:6380/0
      OPENAI_API_KEY: sk-test-placeholder
    services:
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        command: server /data
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ['8200:8200']
        command: server -dev
        options: >-
          --health-cmd "wget -qO- http://localhost:8200/v1/sys/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Initialize Vault transit engine
        run: |
          docker run --rm --network host \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=root \
            hashicorp/vault:latest \
            sh -c 'vault secrets enable transit && vault write -f transit/keys/forensic-aes256-gcm type=aes256-gcm96'
      - name: Create MinIO forensic bucket
        run: |
          docker run --rm --network host quay.io/minio/mc:latest \
            sh -c 'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb -p local/llm-client-forensic'
      - name: Validate staging settings
        run: |
          python -c "from llm_client.config import Settings; s=Settings(); assert s.environment=='staging' and s.forensic_stream_enabled and s.vault_token=='root'"
      - name: Validate prod settings (positive case)
        run: |
          python -c "from llm_client.config import Settings; s=Settings(); assert s.environment=='prod' and s.forensic_stream_enabled"
      - name: Validate prod settings (negative case - should fail)
        run: |
          python -c "from llm_client.config import Settings; s=Settings(); assert s.environment=='prod' and not s.forensic_stream_enabled" || true
        continue-on-error: true
      - name: Forensic e2e test
        run: pytest tests/integration/test_forensic_stream_e2e.py -v --tb=short
      - name: Integration tests with forensic enabled
        run: pytest tests/integration -m integration --maxfail=1

  # F-1 cancel latency on dev Redis (fast sample) — quick feedback on merge/PR.
  cancel-latency-dev:
    runs-on: ubuntu-latest
    env:
      RUN_STAGING_LOAD: '1'
      CANCEL_LATENCY_SAMPLES: '150'
      CANCEL_SESSIONS_CONCURRENT: '25'
      CANCEL_SESSION_START_RPS: '25'
      CANCEL_SESSION_DELAY_S: '0.5'
    services:
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: F-1 cancel latency (dev sample, Redis pub/sub)
        run: pytest -s tests/staging_load/test_cancel_latency.py --maxfail=1

  # E-1 checkpoint latency quick test (PR-pipeline) — quick feedback on merge/PR.
  checkpoint-latency-quick:
    runs-on: ubuntu-latest
    env:
      RUN_STAGING_LOAD: '1'
      CHECKPOINT_LATENCY_SAMPLES: '100'
      CHECKPOINT_SESSIONS_CONCURRENT: '10'
      CHECKPOINT_SESSION_START_RPS: '10'
      CHECKPOINT_NODE_DELAY_S: '0.05'
      P99_BUDGET_MS: '5.0'  # Looser budget for quick test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: llm_client
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Wait for services
        run: |
          # Wait for PostgreSQL
          until python -c "import asyncpg; import asyncio; asyncio.run(asyncpg.connect('postgresql://postgres:postgres@localhost:5432/llm_client'))" 2>/dev/null; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          # Wait for Redis
          until python -c "import redis.asyncio; import asyncio; asyncio.run(redis.asyncio.from_url('redis://localhost:6379/1').ping())" 2>/dev/null; do
            echo "Waiting for Redis..."
            sleep 2
          done
      - name: E-1 checkpoint latency (quick sample)
        run: |
          cd tests/staging_load
          python -m pytest test_checkpoint_latency.py::test_checkpoint_latency_p99_below_2ms -v --tb=short
        env:
          REDIS_URL: redis://localhost:6379/0
          REDIS_CHECKPOINT_URL: redis://localhost:6379/1
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/llm_client

  # E-4 hybrid RAG quick test (PR-pipeline) — quick feedback on merge/PR.
  hybrid-rag-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: E-4 hybrid RAG A/B test (quick mode)
        run: python scripts/ab_test_hybrid_rag.py --quick
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-rag-results
          path: reports/
          retention-days: 30

  # E-4 BM25 indexing regression test — ensure document retrieval in <1 sec.
  bm25-indexing-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: BM25 indexing performance test
        run: |
          python -c "
          import time
          from llm_client.rag.eval.corpus import build_eval_corpus
          from llm_client.rag.eval.mock_pipeline import MockRetrievalPipeline
          
          print('Testing BM25 indexing performance...')
          corpus = build_eval_corpus()
          
          start_time = time.time()
          pipeline = MockRetrievalPipeline(corpus)
          indexing_time = time.time() - start_time
          
          print(f'BM25 indexing time: {indexing_time:.3f} seconds')
          assert indexing_time < 1.0, f'BM25 indexing took {indexing_time:.3f}s, expected <1.0s'
          print('✅ BM25 indexing regression test passed')
          "