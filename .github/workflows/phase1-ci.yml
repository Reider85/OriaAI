name: Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  PIP_CACHE_VERSION: v1
  REDIS_URL: redis://127.0.0.1:6380/0
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  VAULT_ADDR: http://127.0.0.1:8200

jobs:
  # F-2 (PII leak audit) runs here at unit level, plus lint + typecheck.
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Download spaCy model for PII audit (F-2)
        run: python -m spacy download en_core_web_md
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (ruff) — scoped to Phase 1 files
        run: >-
          ruff format --check
          src/llm_client/transport
          tests/unit/test_pii_leak_audit.py
          tests/integration/test_filestorage_parity.py
          tests/staging_load
      - name: Typecheck (mypy)
        run: mypy src/llm_client
      - name: Unit tests + PII leak audit (F-2)
        run: pytest tests/unit --maxfail=1

  # Block A infra (Redis/MinIO/Vault) + F-3 parity on dev MinIO.
  integration-dev:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        command: server /data
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ['8200:8200']
        command: server -dev
        options: >-
          --health-cmd "wget -qO- http://localhost:8200/v1/sys/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Integration tests (F-3 parity on dev MinIO + B-1 infra)
        run: pytest tests/integration --maxfail=1

  # F-1 cancel latency on dev Redis (fast sample) — quick feedback on merge/PR.
  cancel-latency-dev:
    runs-on: ubuntu-latest
    env:
      RUN_STAGING_LOAD: '1'
      CANCEL_LATENCY_SAMPLES: '150'
      CANCEL_SESSIONS_CONCURRENT: '25'
      CANCEL_SESSION_START_RPS: '25'
      CANCEL_SESSION_DELAY_S: '0.5'
    services:
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: F-1 cancel latency (dev sample, Redis pub/sub)
        run: pytest -s tests/staging_load/test_cancel_latency.py --maxfail=1