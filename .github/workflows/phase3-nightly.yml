name: Phase 3 Nightly Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Runs at 2 AM UTC every day
  workflow_dispatch:     # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'
  HF_CACHE_KEY: 'huggingface-v1-{{ hashFiles("pyproject.toml") }}'
  PIPELINE_DATE: ${{ github.event.schedule || github.run_number }}

jobs:
  setup-staging:
    name: Setup Staging Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      redis-url: ${{ steps.start-infra.outputs.redis-url }}
      redis-semantic-url: ${{ steps.start-infra.outputs.redis-semantic-url }}
      postgres-url: ${{ steps.start-infra.outputs.postgres-url }}
      minio-url: ${{ steps.start-infra.outputs.minio-url }}
      vault-url: ${{ steps.start-infra.outputs.vault-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Start infrastructure
        id: start-infra
        run: |
          echo "Starting docker-compose infrastructure..."
          docker-compose up -d redis postgres minio vault prometheus grafana agent-service idealidad-exporter
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          for service in redis postgres minio vault prometheus grafana agent-service idealidad-exporter; do
            timeout 120 bash -c "until docker-compose ps $service | grep -q 'healthy'; do sleep 2; done"
          done
          
          # Output service URLs
          echo "redis-url=redis://localhost:6379/0" >> $GITHUB_OUTPUT
          echo "redis-semantic-url=redis://localhost:6380/2" >> $GITHUB_OUTPUT
          echo "postgres-url=postgresql+asyncpg://postgres:postgres@localhost:5434/llm_client" >> $GITHUB_OUTPUT
          echo "minio-url=http://localhost:9000" >> $GITHUB_OUTPUT
          echo "vault-url=http://localhost:8200" >> $GITHUB_OUTPUT

  phase3-adr011-staging:
    name: Phase 3 ADR-011 Integration (Staging)
    runs-on: ubuntu-latest
    needs: setup-staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: 'pip-v1-{{ hashFiles("pyproject.toml") }}'
          restore-keys: |
            pip-v1-
      - name: Cache HuggingFace
        uses: actions/cache@v3
        with:
          path: ~/.cache/huggingface
          key: ${{ env.HF_CACHE_KEY }}
          restore-keys: |
            huggingface-v1-
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Phase 3 ADR-011 integration tests
        env:
          REDIS_URL: ${{ needs.setup-staging.outputs.redis-url }}
          REDIS_CHECKPOINT_URL: ${{ needs.setup-staging.outputs.redis-url }}/1
          REDIS_SEMANTIC_CACHE_URL: ${{ needs.setup-staging.outputs.redis-semantic-url }}
          SEMANTIC_CACHE_ENABLED: 'true'
          DATABASE_URL: ${{ needs.setup-staging.outputs.postgres-url }}
          S3_ENDPOINT: ${{ needs.setup-staging.outputs.minio-url }}
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: llm-client-files
          ENVIRONMENT: staging
        run: |
          mkdir -p test-results/phase3-adr011
          pytest tests/integration/test_stale_answer_guard.py -v --timeout=600 --junitxml=test-results/phase3-adr011/stale-guard-junit.xml
          pytest tests/integration/test_semantic_cache_integration.py tests/integration/test_invalidator_integration.py -v --timeout=600 --junitxml=test-results/phase3-adr011/cache-invalidator-junit.xml
          pytest tests/integration/test_facts_extractor_integration.py -v --timeout=600 --junitxml=test-results/phase3-adr011/facts-junit.xml
          pytest tests/integration/test_cache_aware_llm_integration.py tests/integration/test_graph_cache_e2e.py -v --timeout=600 --junitxml=test-results/phase3-adr011/graph-junit.xml
      - name: Upload Phase 3 ADR-011 results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: phase3-adr011-staging-${{ env.PIPELINE_DATE }}
          path: test-results/phase3-adr011/
          retention-days: 30

  cleanup-staging:
    name: Cleanup Staging Environment
    runs-on: ubuntu-latest
    needs: [setup-staging, phase3-adr011-staging]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Stop infrastructure
        run: docker-compose down -v

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [phase3-adr011-staging]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          channel: '#ci-notifications'
          fields: repo,message,commit,author,action,eventName,ref,workflow,job
          color: ${{ job.status }} == 'success' ? 'good' : (job.status == 'failure' ? 'danger' : 'warning')